  /* ---------- background candles ---------- */
  const candles = [];
  for(let i=0;i<10;i++){
    const a = (i/10)*Math.PI*2;
    const r = 6.5 + Math.random()*1.5;
    const cGroup = new THREE.Group();
    const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.05,0.7,6), new THREE.MeshStandardMaterial({color:0x3a2818, roughness:0.8}));
    stick.position.y = 0.35;
    cGroup.add(stick);
    const flameSprite = new THREE.Sprite(new THREE.SpriteMaterial({map:goldGlowTex, color:0xffaa44, blending:THREE.AdditiveBlending, depthWrite:false, transparent:true}));
    flameSprite.scale.set(0.35,0.55,1);
    flameSprite.position.y = 0.78;
    flameSprite.userData.flicker = Math.random()*10;
    cGroup.add(flameSprite);
    const cLight = new THREE.PointLight(0xff9944, 0.35, 3);
    cLight.position.y = 0.78;
    cGroup.add(cLight);
    cGroup.position.set(Math.cos(a)*r, -1.3, Math.sin(a)*r);
    scene.add(cGroup);
    candles.push({g:cGroup, flame:flameSprite, light:cLight});
  }

  /* ---------- ambient mist / dust particles ---------- */
  function makeMist(count, radius, colorTex, sizeMin, sizeMax, ySpread){
    const group = new THREE.Group();
    const data = [];
    for(let i=0;i<count;i++){
      const s = new THREE.Sprite(new THREE.SpriteMaterial({map:colorTex, transparent:true, opacity:0.0, blending:THREE.AdditiveBlending, depthWrite:false}));
      const a = Math.random()*Math.PI*2, r = Math.random()*radius;
      s.position.set(Math.cos(a)*r, (Math.random()-0.2)*ySpread, Math.sin(a)*r);
      const sc = sizeMin + Math.random()*(sizeMax-sizeMin);
      s.scale.set(sc,sc,1);
      group.add(s);
      data.push({sprite:s, speed:0.05+Math.random()*0.12, phase:Math.random()*Math.PI*2, baseOpacity:0.08+Math.random()*0.22, baseY:s.position.y, drift:(Math.random()-0.5)*0.15});
    }
    scene.add(group);
    return {group, data};
  }
  const dustMotes = makeMist(160, 4.5, goldGlowTex, 0.03, 0.09, 3);
  const bgMist   = makeMist(45, 8.5, blueGlowTex, 0.6, 1.4, 1.5);

  /* ---------- floating runes orbiting the book ---------- */
  const runeTex = glowTexture('rgba(255,235,190,1)','rgba(255,170,70,0)');
  const floatingRunes = [];
  const runeSymbols = 5;
  for(let i=0;i<runeSymbols;i++){
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.045, 0.06, 5),
      new THREE.MeshBasicMaterial({color:0xbcd8ff, transparent:true, opacity:0.75, blending:THREE.AdditiveBlending, side:THREE.DoubleSide, depthWrite:false})
    );
    scene.add(ring);
    floatingRunes.push({mesh:ring, radius:0.9+Math.random()*0.5, height:0.2+Math.random()*0.6, speed:0.15+Math.random()*0.15, phase:(i/runeSymbols)*Math.PI*2});
  }

  /* ---------- THE BOOK ---------- */
  const book = new THREE.Group();
  book.position.y = 0.1;

  const spineMat = new THREE.MeshStandardMaterial({color:0x4a2f18, roughness:0.5, metalness:0.3, emissive:0x1a0e04, emissiveIntensity:0.2});
  const coverMat = new THREE.MeshStandardMaterial({color:0x5a3a1e, roughness:0.45, metalness:0.35, emissive:0x2a1608, emissiveIntensity:0.25});
  const pageMat  = new THREE.MeshStandardMaterial({color:0xf0e0bc, roughness:0.9, metalness:0.0, emissive:0x3a2c14, emissiveIntensity:0.15});
  const innerPageMat = new THREE.MeshStandardMaterial({color:0xf5e8c8, roughness:0.85, metalness:0.0, emissive:0x4a3a1a, emissiveIntensity:0.2, side:THREE.DoubleSide});
  const runeMat  = new THREE.MeshBasicMaterial({color:0xffd98a, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending, depthWrite:false});

  const spine = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.14, 0.9), spineMat);
  book.add(spine);

  const pageStack = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.11, 0.84), pageMat);
  book.add(pageStack);

  const coverGeo = new THREE.BoxGeometry(0.4, 0.03, 0.9);
  const leftHinge = new THREE.Group(); leftHinge.position.set(-0.02,0.055,0);
  const leftCover = new THREE.Mesh(coverGeo, coverMat);
  leftCover.position.x = -0.2;
  leftCover.castShadow = true;
  leftHinge.add(leftCover);
  book.add(leftHinge);

  const rightHinge = new THREE.Group(); rightHinge.position.set(0.02,0.055,0);
  const rightCover = new THREE.Mesh(coverGeo, coverMat);
  rightCover.position.x = 0.2;
  rightCover.castShadow = true;
  rightHinge.add(rightCover);
  book.add(rightHinge);

  // ── inner pages: 3 thin leaves per side, staggered, for a real page-turn
  // (rather than just the two cover "doors" opening) ──
  const innerPagesLeft = [], innerPagesRight = [];
  const pageGeo = new THREE.PlaneGeometry(0.38, 0.86);
  for(let i=0;i<3;i++){
    const hL = new THREE.Group(); hL.position.set(-0.015, 0.058+i*0.004, 0);
    const pL = new THREE.Mesh(pageGeo, innerPageMat);
    pL.position.x = -0.19; pL.rotation.y = Math.PI;
    hL.add(pL); book.add(hL);
    innerPagesLeft.push(hL);

    const hR = new THREE.Group(); hR.position.set(0.015, 0.058+i*0.004, 0);
    const pR = new THREE.Mesh(pageGeo, innerPageMat);
    pR.position.x = 0.19;
    hR.add(pR); book.add(hR);
    innerPagesRight.push(hR);
  }

  const runeGeo = new THREE.RingGeometry(0.08,0.1,32);
  const rune = new THREE.Mesh(runeGeo, runeMat);
  rune.rotation.x = -Math.PI/2;
  rune.position.set(0.2, 0.09, 0);
  rightCover.add(rune);
  const runeCore = new THREE.Sprite(new THREE.SpriteMaterial({map:goldGlowTex, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false}));
  runeCore.scale.set(0.3,0.3,1);
  runeCore.position.set(0,0.02,0);
  rightCover.add(runeCore);

  book.traverse(o=>{ if(o.isMesh) o.castShadow = true; });
  scene.add(book);

  const bookHalo = new THREE.Sprite(new THREE.SpriteMaterial({map:goldGlowTex, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false, opacity:0.5}));
  bookHalo.scale.set(2.4,2.4,1);
  bookHalo.position.copy(book.position);
  scene.add(bookHalo);

  /* ---------- optional ambient audio (synthesized placeholder) ----------
     No licensed orchestral track is available in this environment, so
     this is a small Web Audio pad + chime — good enough to sell "the room
     is alive" without silence. Swap for a real track by replacing this
     block with an <audio> element pointed at your asset; everything else
     (mute button, cleanup) can stay as-is. */
  let audioCtx = null, audioNodes = null, muted = false;
  function startAmbientAudio(){
    if(audioCtx) return;
    try{
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const master = audioCtx.createGain();
      master.gain.value = 0.06;
      master.connect(audioCtx.destination);
      const osc1 = audioCtx.createOscillator(); osc1.type='sine'; osc1.frequency.value=110;
      const osc2 = audioCtx.createOscillator(); osc2.type='sine'; osc2.frequency.value=165.5;
      const lfo = audioCtx.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.08;
      const lfoGain = audioCtx.createGain(); lfoGain.gain.value=0.02;
      lfo.connect(lfoGain); lfoGain.connect(master.gain);
      osc1.connect(master); osc2.connect(master);
      osc1.start(); osc2.start(); lfo.start();
      audioNodes = {osc1, osc2, lfo, master};
    }catch(e){ console.warn('[intro audio] unavailable:', e); }
  }
  function stopAmbientAudio(){
    if(!audioCtx) return;
    try{
      audioNodes.osc1.stop(); audioNodes.osc2.stop(); audioNodes.lfo.stop();
      audioCtx.close();
    }catch(e){}
    audioCtx = null; audioNodes = null;
  }
  if(muteBtn){
    muteBtn.textContent = '🔊';
    muteBtn.onclick = ()=>{
      muted = !muted;
      muteBtn.textContent = muted ? '🔇' : '🔊';
      if(audioNodes) audioNodes.master.gain.value = muted ? 0 : 0.06;
    };
  }

  /* ---------- state machine ---------- */
  const STATE = {ORBIT:'orbit', OPENING:'opening', BURST:'burst', PORTAL:'portal', DONE:'done'};
  let state = STATE.ORBIT;
  let stateTime = 0;
  const clock = new THREE.Clock();
  let rafId = null;
  let camShake = 0;

  setTimeout(()=>{ if(state===STATE.ORBIT) hint.classList.add('show'); }, 1200);

  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  function onPointerDown(e){
    if(state !== STATE.ORBIT) return;
    const x = (e.clientX ?? e.touches?.[0]?.clientX);
    const y = (e.clientY ?? e.touches?.[0]?.clientY);
    mouse.x = (x/innerWidth)*2-1;
    mouse.y = -(y/innerHeight)*2+1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObject(book, true);
    if(hits.length){ beginOpen(false); }
  }
  cv.addEventListener('pointerdown', onPointerDown);
  function onSkipClick(){ if(state===STATE.ORBIT) beginOpen(true); }
  skipBtn.addEventListener('click', onSkipClick);

  function beginOpen(skip){
    state = STATE.OPENING;
    stateTime = 0;
    hint.classList.remove('show');
    skipBtn.style.pointerEvents = 'none';
    skipBtn.style.opacity = '0';
    startAmbientAudio();
    spawnBurstParticles();
    if(skip){ fastForward = true; }
  }
  let fastForward = false;

  let burstParticles = null;
  function spawnBurstParticles(){
    const count = 600;
    const geo = new THREE.BufferGeometry();
    const positions = new Float32Array(count*3);
    const velocities = [];
    for(let i=0;i<count;i++){
      positions[i*3]=0; positions[i*3+1]=0.1; positions[i*3+2]=0;
      const theta = Math.random()*Math.PI*2;
      const phi = Math.acos((Math.random()*2)-1);
      const speed = 1.2 + Math.random()*2.8;
      velocities.push(new THREE.Vector3(
        Math.sin(phi)*Math.cos(theta)*speed,
        Math.abs(Math.cos(phi))*speed*1.3 + 0.6,
        Math.sin(phi)*Math.sin(theta)*speed
      ));
    }
    geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
    const mat = new THREE.PointsMaterial({size:0.05, map:goldGlowTex, color:0xffdca0, transparent:true, opacity:1, blending:THREE.AdditiveBlending, depthWrite:false});
    const pts = new THREE.Points(geo, mat);
    scene.add(pts);
    burstParticles = {pts, velocities, geo};
  }

  const portalGroup = new THREE.Group();
  portalGroup.visible = false;
  const portalRingGeo = new THREE.TorusGeometry(1, 0.05, 16, 64);
  const portalRingMat = new THREE.MeshBasicMaterial({color:0xffd98a, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending});
  const portalRing = new THREE.Mesh(portalRingGeo, portalRingMat);
  portalGroup.add(portalRing);
  const portalRing2 = new THREE.Mesh(portalRingGeo.clone(), new THREE.MeshBasicMaterial({color:0x9ac6ff, transparent:true, opacity:0.5, blending:THREE.AdditiveBlending}));
  portalRing2.scale.setScalar(0.82);
  portalGroup.add(portalRing2);
  const portalDiscMat = new THREE.MeshBasicMaterial({color:0xfff3d6, transparent:true, opacity:0.0, blending:THREE.AdditiveBlending, side:THREE.DoubleSide});
  const portalDisc = new THREE.Mesh(new THREE.CircleGeometry(1,48), portalDiscMat);
  portalGroup.add(portalDisc);
  scene.add(portalGroup);

  const ringPool = [];
  for(let i=0;i<8;i++){
    const r = new THREE.Mesh(portalRingGeo.clone(), new THREE.MeshBasicMaterial({color:0xffe6b0, transparent:true, opacity:0, blending:THREE.AdditiveBlending}));
    r.visible=false;
    scene.add(r);
    ringPool.push({mesh:r, active:false, t:0});
  }
  function fireRing(delay){
    setTimeout(()=>{
      const r = ringPool.find(r=>!r.active) || ringPool[0];
      r.active = true; r.t = 0; r.mesh.visible = true; r.mesh.scale.setScalar(0.1);
      r.mesh.position.copy(portalGroup.position);
      r.mesh.quaternion.copy(camera.quaternion);
    }, delay);
  }

  let orbitAngle = 0;

  function finishIntro(){
    cancelAnimationFrame(rafId);
    removeEventListener('resize', onResize);
    cv.removeEventListener('pointerdown', onPointerDown);
    skipBtn.removeEventListener('click', onSkipClick);
    document.getElementById('sBookIntro').classList.add('off');
    stopAmbientAudio();
    renderer.dispose();
    _introActive = false;
    if(typeof window.bookIntroFinished === 'function') window.bookIntroFinished();
  }

  function animate(){
    rafId = requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    stateTime += dt;
    const t = clock.elapsedTime;

    candles.forEach(c=>{
      const f = 0.85 + Math.sin(t*8 + c.flame.userData.flicker)*0.1 + Math.sin(t*23+c.flame.userData.flicker)*0.05;
      c.flame.material.opacity = f;
      c.light.intensity = 0.3*f;
    });

    [dustMotes, bgMist].forEach(m=>{
      m.data.forEach(d=>{
        d.sprite.position.y = d.baseY + Math.sin(t*d.speed + d.phase)*0.4;
        d.sprite.position.x += d.drift*dt;
        const targetOp = d.baseOpacity * (state===STATE.ORBIT ? 1 : 0.4);
        d.sprite.material.opacity += (targetOp - d.sprite.material.opacity)*0.02;
      });
    });

    floatingRunes.forEach((r,i)=>{
      const a = t*r.speed + r.phase;
      r.mesh.position.set(Math.cos(a)*r.radius, book.position.y + r.height + Math.sin(t*0.7+i)*0.05, Math.sin(a)*r.radius);
      r.mesh.rotation.z += dt*0.6;
      r.mesh.lookAt(camera.position);
      r.mesh.material.opacity = state===STATE.ORBIT ? (0.55+Math.sin(t*2+i)*0.2) : 0.15;
    });

    const breathe = 1 + Math.sin(t*1.3)*0.015;
    book.scale.setScalar(breathe);
    bookHalo.material.opacity = 0.4 + Math.sin(t*1.3)*0.08;
    bookHalo.scale.setScalar(2.4 + Math.sin(t*0.9)*0.15);
    runeCore.material.opacity = 0.6 + Math.sin(t*2.2)*0.3;
    rune.material.opacity = 0.7 + Math.sin(t*2.2)*0.25;
    bookLight.intensity = 3.0 + Math.sin(t*1.3)*0.4;

    if(state === STATE.ORBIT){
      book.position.y = 0.1 + Math.sin(t*0.8)*0.05;
      bookHalo.position.y = book.position.y;
      orbitAngle += dt * 0.09;
      const r = 4.6, h = 1.6 + Math.sin(t*0.15)*0.3;
      camera.position.set(Math.cos(orbitAngle)*r, h, Math.sin(orbitAngle)*r);
      camera.lookAt(0, 0.3, 0);
    }

    else if(state === STATE.OPENING){
      const dur = fastForward ? 1.2 : 3.4;
      const p = Math.min(stateTime/dur, 1);
      const ease = 1-Math.pow(1-p,3);
      const r = 4.6*(1-ease*0.75), h = 1.6*(1-ease*0.6)+0.3*ease;
      camera.position.set(Math.cos(orbitAngle)*r, h, Math.sin(orbitAngle)*r);
      camera.lookAt(0, 0.3, 0);
      // covers open first...
      const coverEase = Math.min(ease*1.6, 1);
      leftHinge.rotation.y = -coverEase*2.3;
      rightHinge.rotation.y = coverEase*2.3;
      // ...then inner pages fan open in a staggered flip, selling a real page-turn
      innerPagesLeft.forEach((h,i)=>{
        const pe = Math.max(0, Math.min((ease*1.9 - i*0.18), 1));
        h.rotation.y = -pe*2.0;
      });
      innerPagesRight.forEach((h,i)=>{
        const pe = Math.max(0, Math.min((ease*1.9 - i*0.18), 1));
        h.rotation.y = pe*2.0;
      });
      bookLight.intensity = 3 + ease*8;
      underGlow.intensity = 1.4 + ease*5;
      rayMat.opacity = 0.08 + ease*0.35;
      rayCol2.material.opacity = rayMat.opacity*0.7;
      if(p>=1){ state = STATE.BURST; stateTime = 0; camShake = 1; }
    }

    else if(state === STATE.BURST){
      const dur = fastForward ? 0.5 : 1.2;
      const p = Math.min(stateTime/dur,1);
      if(burstParticles){
        const pos = burstParticles.geo.attributes.position;
        for(let i=0;i<burstParticles.velocities.length;i++){
          const v = burstParticles.velocities[i];
          pos.array[i*3]   += v.x*dt;
          pos.array[i*3+1] += v.y*dt;
          pos.array[i*3+2] += v.z*dt;
          v.y -= dt*0.6;
        }
        pos.needsUpdate = true;
        burstParticles.pts.material.opacity = 1-p;
      }
      // subtle cinematic camera shake on impact, decaying
      camShake *= 0.9;
      camera.position.x += (Math.random()-0.5)*camShake*0.04;
      camera.position.y += (Math.random()-0.5)*camShake*0.04;
      fadeEl.style.transition = 'opacity .35s ease';
      fadeEl.classList.toggle('on', p>0.55);
      if(p>=1){
        scene.remove(burstParticles.pts);
        burstParticles = null;
        state = STATE.PORTAL; stateTime = 0;
        portalGroup.visible = true;
        portalGroup.position.set(0,0.3,0);
        portalGroup.scale.setScalar(0.01);
        fireRing(0); fireRing(160); fireRing(320); fireRing(480); fireRing(640);
      }
    }

    else if(state === STATE.PORTAL){
      const dur = fastForward ? 1.4 : 2.8;
      const p = Math.min(stateTime/dur,1);
      const ease = p<0.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;
      portalGroup.scale.setScalar(0.01 + ease*3.4);
      portalRing.rotation.z += dt*1.4;
      portalRing2.rotation.z -= dt*1.0;
      portalDisc.material.opacity = Math.sin(p*Math.PI)*0.35;
      portalGroup.quaternion.copy(camera.quaternion);
      camera.position.lerp(new THREE.Vector3(0,0.3,-0.3), ease*0.38);
      camera.fov = 42 + ease*36;
      camera.updateProjectionMatrix();
      fadeEl.style.transition = 'opacity .5s ease';
      fadeEl.classList.toggle('on', p>0.7);

      if(p>=1){
        state = STATE.DONE;
        setTimeout(finishIntro, 180);
      }
    }

    ringPool.forEach(r=>{
      if(!r.active) return;
      r.t += dt;
      const p = Math.min(r.t/1.4,1);
      r.mesh.scale.setScalar(0.1 + p*4.2);
      r.mesh.material.opacity = (1-p)*0.7;
      if(p>=1){ r.active=false; r.mesh.visible=false; }
    });

    renderer.render(scene, camera);
  }
  animate();
};

// Play once automatically on first load. Also available as
// window.playBookIntro() for replays (see the "Replay Intro" link on
// World Select, and goTitle() reachable from other screens' back buttons).
window.playBookIntro();
</script>
</body>
</html>
